<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSP Attendance Database Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .controls {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-card .number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-card .label {
            opacity: 0.9;
            font-size: 0.9em;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .badge-present {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-absent {
            background: #f8d7da;
            color: #721c24;
        }
        
        .badge-game {
            background: #cfe2ff;
            color: #084298;
        }
        
        .badge-graphics {
            background: #e7d5ff;
            color: #5a189a;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }
        
        .json-view {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 MSP Attendance Database Viewer</h1>
            <p>View and manage your attendance database</p>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="loadDatabase()">🔄 Refresh Database</button>
            <button class="btn btn-primary" onclick="loadStats()">📈 View Statistics</button>
            <button class="btn btn-secondary" onclick="loadMembersAttendance()">👥 Members & Attendance</button>
        </div>
        
        <div class="content" id="content">
            <div class="loading">Click a button above to load data...</div>
        </div>
    </div>

    <script>
        // const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
        //     ? 'http://localhost:3001/api'
        //     : '/api';

        const API_BASE = 'https://event-attendance-system-iqk5y3aj4-joeragheb29s-projects.vercel.app/api';

        async function loadDatabase() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading database...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/admin/database`);
                const data = await response.json();
                
                let html = `
                    <div class="section">
                        <h2>📊 Summary</h2>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="number">${data.summary.totalMembers}</div>
                                <div class="label">Total Members</div>
                            </div>
                            <div class="stat-card">
                                <div class="number">${data.summary.totalSessions}</div>
                                <div class="label">Total Sessions</div>
                            </div>
                            <div class="stat-card">
                                <div class="number">${data.summary.totalAttendanceRecords}</div>
                                <div class="label">Attendance Records</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="section">
                        <h2>👥 Members (${data.members.length})</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Role</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Created</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.members.map(m => `
                                    <tr>
                                        <td>${m.id}</td>
                                        <td><strong>${m.name}</strong></td>
                                        <td><span class="badge badge-${m.category}">${m.category}</span></td>
                                        <td>${m.role}</td>
                                        <td>${m.email || '—'}</td>
                                        <td>${m.phone || '—'}</td>
                                        <td>${new Date(m.createdAt).toLocaleDateString()}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="section">
                        <h2>📅 Sessions (${data.sessions.length})</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Date</th>
                                    <th>Created</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.sessions.map(s => `
                                    <tr>
                                        <td>${s.id}</td>
                                        <td><strong>${s.name}</strong></td>
                                        <td>${new Date(s.date).toLocaleDateString()}</td>
                                        <td>${new Date(s.createdAt).toLocaleDateString()}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="section">
                        <h2>✅ Attendance Records (${data.attendance.length})</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Member</th>
                                    <th>Session</th>
                                    <th>Status</th>
                                    <th>Notes</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.attendance.map(a => `
                                    <tr>
                                        <td>${a.id}</td>
                                        <td><strong>${a.memberName}</strong> <span class="badge badge-${a.memberCategory}">${a.memberCategory}</span></td>
                                        <td>${a.sessionName}</td>
                                        <td><span class="badge badge-${a.status}">${a.status}</span></td>
                                        <td>${a.notes || '—'}</td>
                                        <td>${new Date(a.createdAt).toLocaleDateString()}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                
                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = `<div class="error">Error loading database: ${error.message}<br>Make sure the server is running on http://localhost:3001</div>`;
            }
        }
        
        async function loadStats() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading statistics...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/admin/stats`);
                const data = await response.json();
                
                let html = `
                    <div class="section">
                        <h2>📈 Statistics</h2>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="number">${data.totals.members}</div>
                                <div class="label">Total Members</div>
                            </div>
                            <div class="stat-card">
                                <div class="number">${data.totals.sessions}</div>
                                <div class="label">Total Sessions</div>
                            </div>
                            <div class="stat-card">
                                <div class="number">${data.totals.attendanceRecords}</div>
                                <div class="label">Attendance Records</div>
                            </div>
                            <div class="stat-card">
                                <div class="number">${data.totals.present}</div>
                                <div class="label">Present</div>
                            </div>
                            <div class="stat-card">
                                <div class="number">${data.totals.absent}</div>
                                <div class="label">Absent</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="section">
                        <h2>👥 Members by Category</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Category</th>
                                    <th>Count</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.membersByCategory.map(m => `
                                    <tr>
                                        <td><span class="badge badge-${m.category}">${m.category}</span></td>
                                        <td><strong>${m.count}</strong></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="section">
                        <h2>📊 Attendance by Session</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Session</th>
                                    <th>Present</th>
                                    <th>Absent</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.attendanceBySession.map(s => `
                                    <tr>
                                        <td><strong>${s.sessionName}</strong></td>
                                        <td><span class="badge badge-present">${s.present || 0}</span></td>
                                        <td><span class="badge badge-absent">${s.absent || 0}</span></td>
                                        <td><strong>${(s.present || 0) + (s.absent || 0)}</strong></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                
                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = `<div class="error">Error loading statistics: ${error.message}</div>`;
            }
        }
        
        async function loadMembersAttendance() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading members attendance...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/admin/members-attendance`);
                const data = await response.json();
                
                let html = `
                    <div class="section">
                        <h2>👥 Members with Attendance Summary</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Role</th>
                                    <th>Total Sessions</th>
                                    <th>Present</th>
                                    <th>Absent</th>
                                    <th>Attendance %</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.map(m => {
                                    const total = m.totalSessionsAttended || 0;
                                    const present = m.presentCount || 0;
                                    const absent = m.absentCount || 0;
                                    const percentage = total > 0 ? Math.round((present / total) * 100) : 0;
                                    
                                    return `
                                        <tr>
                                            <td>${m.id}</td>
                                            <td><strong>${m.name}</strong></td>
                                            <td><span class="badge badge-${m.category}">${m.category}</span></td>
                                            <td>${m.role}</td>
                                            <td><strong>${total}</strong></td>
                                            <td><span class="badge badge-present">${present}</span></td>
                                            <td><span class="badge badge-absent">${absent}</span></td>
                                            <td><strong>${percentage}%</strong></td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                
                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = `<div class="error">Error loading members attendance: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
